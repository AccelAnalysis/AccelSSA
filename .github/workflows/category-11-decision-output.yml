name: Category 11 - Live Deliverables

on:
  pull_request:
    paths:
      - "packages/decision-output/**"
      - "src/app/deliverables/**"
      - "src/components/deliverables/**"
      - "docs/category-11-evidence-recommendations-client-deliverables.md"
      - ".github/workflows/category-11-decision-output.yml"
  push:
    branches:
      - main
    paths:
      - "packages/decision-output/**"
      - "src/app/deliverables/**"
      - "src/components/deliverables/**"
      - "docs/category-11-evidence-recommendations-client-deliverables.md"
      - ".github/workflows/category-11-decision-output.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Decision output tests
        run: npm run test --workspace @accelssa/decision-output
      - name: Full application check
        run: npm run check
