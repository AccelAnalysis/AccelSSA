name: Category 11 - Decision Output

on:
  pull_request:
    paths:
      - "packages/decision-output/**"
      - "docs/category-11-evidence-recommendations-client-deliverables.md"
      - ".github/workflows/category-11-decision-output.yml"
  push:
    branches:
      - main
    paths:
      - "packages/decision-output/**"
      - "docs/category-11-evidence-recommendations-client-deliverables.md"
      - ".github/workflows/category-11-decision-output.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/decision-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
