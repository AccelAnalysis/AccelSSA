name: Category 03 Projects Workflow

on:
  pull_request:
    paths:
      - "domains/projects-workflow/**"
      - "src/domains/projects-workspace/**"
      - "src/components/projects/**"
      - "src/components/workspace/projects-workspace.tsx"
      - "src/app/projects/**"
      - "src/app/contacts/**"
      - "src/app/api/v1/projects/**"
      - "db/migrations/0003_projects_clients_workflow.sql"
      - ".github/workflows/category-03-projects.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Category 03 domain tests
        run: npm run test --workspace @accelssa/projects-workflow
      - name: Full repository check
        run: npm run check
