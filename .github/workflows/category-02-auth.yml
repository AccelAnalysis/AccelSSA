name: Category 02 Firebase Auth

on:
  pull_request:
    paths:
      - "src/domains/identity-security/**"
      - "src/components/auth/**"
      - "src/app/auth/**"
      - "src/app/account/**"
      - "src/app/unauthorized/**"
      - "src/app/api/v1/auth/**"
      - "src/app/api/v1/admin/**"
      - "src/proxy.ts"
      - "src/app/layout.tsx"
      - "src/components/shell/app-shell.tsx"
      - "src/components/shell/topbar.tsx"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/category-02-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full repository check
        run: npm run check
