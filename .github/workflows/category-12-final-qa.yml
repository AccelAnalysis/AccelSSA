name: Category 12 Final Cross-Platform QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "packages/**"
      - "domains/**"
      - "db/**"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/category-12-final-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete product check
        run: npm run check
