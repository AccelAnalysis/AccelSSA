name: Category 2 Security Core

on:
  push:
    paths:
      - 'domains/identity-security/**'
      - '.github/workflows/category-02-security-core.yml'
  pull_request:
    paths:
      - 'domains/identity-security/**'
      - '.github/workflows/category-02-security-core.yml'

permissions:
  contents: read

jobs:
  security-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domains/identity-security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Category 2 policy tests
        run: npm test
